name: Vela real Docker CLI recover smoke (no production deployment)

on:
  workflow_dispatch:
  push:
    branches: [vela-dev]
    paths:
      - "tests/ci_real_docker_recover.py"
      - "deploy/vela/vela"
      - ".github/workflows/vela-real-docker-recover.yml"

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout audited source with complete history and no saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce historical privacy delta and unchanged upstream Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          python3 vela-development/integration/baseline_privacy_gate.py
          bash -n deploy/vela/vela
          python3 -m py_compile tests/ci_real_docker_recover.py
          python3 -m unittest discover -s tests -p test_vela_dockerfile_isolation.py -v
          python3 deploy/vela/ci_prepare_dockerfile.py Dockerfile "$RUNNER_TEMP/VelaCiRecoveryDockerfile"
          test -z "$(git status --porcelain)"
      - name: Build actual Vela development image only on ephemeral runner
        run: docker build --pull --no-cache -f "$RUNNER_TEMP/VelaCiRecoveryDockerfile" -t vela-ci-recovery-old:local .
      - name: Build deliberately unhealthy synthetic candidate
        shell: bash
        run: |
          set -euo pipefail
          ctx="$(mktemp -d)"
          trap 'rm -rf "$ctx"' EXIT
          printf 'FROM alpine:3.22\nCMD ["sleep", "300"]\n' > "$ctx/Dockerfile"
          docker build --pull --no-cache -t vela-ci-recovery-failed:local "$ctx"
      - name: Run actual Vela recover and Docker Compose rollback with synthetic state
        shell: bash
        run: |
          set -euo pipefail
          sudo env "GITHUB_ACTIONS=true" "PATH=$PATH" python3 tests/ci_real_docker_recover.py
      - name: Final strict privacy scan of complete recovered image
        shell: bash
        run: |
          set -euo pipefail
          docker image save vela-ci-recovery-old:local | python3 deploy/vela/image_layer_audit.py --stdin
          echo "No image, signing key, backup, or test credentials published."
