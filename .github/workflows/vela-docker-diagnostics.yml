name: Vela isolated Docker image privacy diagnostic

on:
  workflow_dispatch:
  push:
    branches: [vela-dev]
    paths:
      - "deploy/vela/image_layer_audit.py"
      - "tests/test_image_layer_audit.py"
      - ".github/workflows/vela-docker-diagnostics.yml"

permissions:
  contents: read

jobs:
  image-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout audited source, including original Git baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify fixed upstream privacy baseline
        run: python3 vela-development/integration/baseline_privacy_gate.py
      - name: Run privacy scanner tests without real secrets
        run: python3 -m unittest discover -s tests -p test_image_layer_audit.py -v
      - name: Build local image without credentials, cache, registry push or publication
        run: docker build --pull --no-cache -t vela-diagnostic:local .
      # This review never changes release gates: any suspicious marker still
      # produces a failing exit status. Only fixed category counts are logged.
      - name: Scan every layer and print finding counts ONLY
        shell: bash
        run: |
          set -euo pipefail
          docker image save vela-diagnostic:local | python3 deploy/vela/image_layer_audit.py --stdin --diagnostic-counts
          echo "Vela Docker diagnostic scan passed; no image or files published."
