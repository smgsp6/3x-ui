name: Vela beta image build and isolation tests
on:
  push:
    branches: [vela-dev]
    paths: [deploy/vela/beta-build-lock.json]

permissions:
  contents: read

concurrency:
  group: vela-beta-build
  cancel-in-progress: false

jobs:
  beta-build:
    if: github.repository == 'smgsp6/3x-ui' && github.ref == 'refs/heads/vela-dev' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ab4e3dfd1b1640797ffdba439b151e6c37d40b0f
          persist-credentials: false
          path: delivery
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9ef190a504221c95925b5224005355bd1313c147
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Preflight and stage reviewed public inputs
        id: inputs
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(docker context show)" = default
          test "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" = unix:///var/run/docker.sock
          containers=$(docker ps -aq)
          test -z "$containers"
          docker compose version
          docker buildx version
          python3 -c 'import yaml'
          command -v jq openssl flock
          # The unmodified recovery harness runs as root for its protected
          # SQLite, maintenance lock and synthetic certificate fixture.
          sudo -n true
          test "$(getconf _NPROCESSORS_ONLN)" -ge 2
          awk '/^MemTotal:/ {exit !($2 >= 6500000)}' /proc/meminfo
          df --output=avail -k "$RUNNER_TEMP" | awk 'NR == 2 {exit !($1 >= 12582912)}'
          test -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}"
          root="$RUNNER_TEMP/vela-beta"
          install -d -m 700 "$root"
          git -C control show "$GITHUB_SHA:deploy/vela/beta-build-lock.json" > "$root/reviewed-lock.json"
          python3 control/deploy/vela/beta-stage-inputs.py "$root/reviewed-lock.json" "$root"
          {
            echo "image_lock_sha=$(sha256sum "$root/image-lock.json" | cut -d' ' -f1)"
            echo "trivy_sha=$(cat "$root/trivy.sha256")"
            echo "db_sha=$(cat "$root/db.sha256")"
            echo "db_metadata_sha=$(jq -er .db.metadata_sha256 "$root/reviewed-lock.json")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.13.1'
      - name: Build and test locally on this disposable VM
        working-directory: candidate
        env:
          APPROVED_INPUT_LOCK_SHA256: ${{ steps.inputs.outputs.image_lock_sha }}
          APPROVED_TRIVY_SHA256: ${{ steps.inputs.outputs.trivy_sha }}
          APPROVED_TRIVY_DB_SHA256: ${{ steps.inputs.outputs.db_sha }}
          APPROVED_TRIVY_DB_METADATA_SHA256: ${{ steps.inputs.outputs.db_metadata_sha }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/vela-beta"
          export PATH="$root/bin:$PATH"
          export XDG_RUNTIME_DIR="$root"
          export VELA_BUILD_EVIDENCE="$root/vela-beta-evidence"
          export VELA_EXCLUSIVE_DOCKER=YES
          export APPROVED_DELIVERY_SHA=ab4e3dfd1b1640797ffdba439b151e6c37d40b0f
          export VELA_INPUT_LOCK="$root/image-lock.json"
          export VELA_INPUT_DIR="$root/inputs"
          export TRIVY_CACHE_DIR="$root/trivy-cache"
          [[ "$APPROVED_TRIVY_DB_METADATA_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$TRIVY_CACHE_DIR/db/metadata.json" | cut -d' ' -f1)" = "$APPROVED_TRIVY_DB_METADATA_SHA256"
          git switch -c vela-dev
          # Keep transient download URLs and fixture diagnostics on this VM.
          if ! bash ../delivery/deploy/vela/beta-image.sh build > "$root/build.log" 2>&1; then
            echo 'Candidate build or verification failed. No deployable image was produced.'
            exit 1
          fi
          test -s "$VELA_BUILD_EVIDENCE"
          jq -e '{source, tool, lock, config_id}' "$VELA_BUILD_EVIDENCE"
          echo 'PASS: image layers, dependency scans, HTTPS, Xray TCP/UDP and recovery.'
      - name: Remove temporary inputs and test resources
        if: always()
        run: |
          # These fixed names are reserved only on this fresh hosted VM.
          docker rm -f vela-miniapp-auth vela_panel >/dev/null 2>&1 || true
          docker image rm vela-ci-recovery-old:local vela-ci-recovery-failed:local >/dev/null 2>&1 || true
          # Fixture setup created root-owned synthetic files.
          if test -d "$RUNNER_TEMP/vela-beta"; then
            sudo -n rm -rf -- "$RUNNER_TEMP/vela-beta"
          fi
