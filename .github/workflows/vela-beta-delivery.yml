name: Vela private beta image delivery
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Enter PUBLISH-PRIVATE-BETA after owner approval
        required: true
        type: string

permissions: {}
concurrency:
  group: vela-private-beta-delivery
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'smgsp6/3x-ui' && github.ref == 'refs/heads/vela-dev' && inputs.confirm == 'PUBLISH-PRIVATE-BETA'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      config_id: ${{ steps.publish.outputs.config_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: delivery
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 9ef190a504221c95925b5224005355bd1313c147
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Check pinned CI and existing private package
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash delivery/deploy/vela/beta-image.sh precheck
      - name: Build and audit pinned candidate with no registry token
        working-directory: candidate
        run: |
          git switch -c vela-dev
          bash ../delivery/deploy/vela/beta-image.sh build
      - name: Publish only the audited candidate tag
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash delivery/deploy/vela/beta-image.sh publish PUBLISH-PRIVATE-BETA

  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve remote manifest and independently pull by digest
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CONFIG_ID: ${{ needs.publish.outputs.config_id }}
        run: bash deploy/vela/beta-image.sh verify
