name: Vela Go and React build smoke (non-deploy)

on:
  workflow_dispatch:
  push:
    branches: [vela-dev]
    paths:
      - "internal/**"
      - "frontend/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/vela-build-smoke.yml"

permissions:
  contents: read

concurrency:
  group: vela-build-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify unchanged upstream privacy baseline
        run: python3 vela-development/integration/baseline_privacy_gate.py
      - name: Configure Go from unchanged module declaration
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure Node 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked UI dependencies
        working-directory: frontend
        run: npm ci
      - name: Build React panel and official Telegram Mini App
        working-directory: frontend
        run: npm run build
      - name: Validate Vela and original entrypoints for Go embedding
        shell: bash
        run: |
          set -euo pipefail
          test -s internal/web/dist/index.html
          test -s internal/web/dist/login.html
          test -s internal/web/dist/miniapp.html
      - name: Compile all Go packages without executing tests
        run: go test -run '^$' ./...
      - name: Enforce panel API router documentation contract
        run: go test ./internal/web -run '^TestRouteRegistryContract
      - name: Ensure build binary exists without publishing it
        shell: bash
        run: |
          test -s "${RUNNER_TEMP}/vela-build-smoke"
          echo "PASS: source compiles in isolated GitHub runner, no artifacts published."
 -count=1
      - name: Build Go panel binary only into runner scratch
        run: go build -trimpath -o "${RUNNER_TEMP}/vela-build-smoke" ./main.go
      - name: Ensure build binary exists without publishing it
        shell: bash
        run: |
          test -s "${RUNNER_TEMP}/vela-build-smoke"
          echo "PASS: source compiles in isolated GitHub runner, no artifacts published."
