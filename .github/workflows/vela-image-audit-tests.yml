name: Vela Docker image privacy scanner unit tests

on:
  push:
    branches: [vela-dev]
    paths:
      - "deploy/vela/image_layer_audit.py"
      - "tests/test_image_layer_audit.py"
      - ".github/workflows/vela-image-audit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate image scanner syntax
        run: python3 -m py_compile deploy/vela/image_layer_audit.py tests/test_image_layer_audit.py
      - name: Test legacy and OCI image archive safety
        run: python3 -m unittest discover -s tests -p test_image_layer_audit.py -v
