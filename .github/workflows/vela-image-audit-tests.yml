name: Vela Docker image privacy scanner unit tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-audit:
    if: github.repository == 'smgsp6/3x-ui' && github.event.repository.private == false && github.ref == 'refs/heads/vela-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate image scanner syntax
        run: python3 -m py_compile deploy/vela/image_layer_audit.py tests/test_image_layer_audit.py
      - name: Test legacy and OCI image archive safety
        run: python3 -m unittest discover -s tests -p test_image_layer_audit.py -v
      - name: Scan a real Docker engine image export (no external image pull)
        shell: bash
        run: |
          set -euo pipefail
          context="$(mktemp -d)"
          trap 'rm -rf "$context"' EXIT
          printf 'FROM scratch\nCOPY canary.txt /app/canary.txt\n' > "$context/Dockerfile"
          printf 'Vela synthetic public image archive canary\n' > "$context/canary.txt"
          docker build --no-cache -t vela-image-audit-canary:local "$context"
          docker image save vela-image-audit-canary:local | python3 deploy/vela/image_layer_audit.py --stdin
          echo "Real Docker engine archive scan passed; image not pushed or uploaded."

