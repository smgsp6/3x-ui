name: Vela Telegram Mini App HTTPS authentication smoke (synthetic only)

on:
  workflow_dispatch:
  push:
    branches: [vela-dev]
    paths:
      - "tests/ci_miniapp_https_auth.py"
      - "deploy/vela/ci_prepare_dockerfile.py"
      - "deploy/vela/ci_pin_mtg_dockerinit.sh"
      - "deploy/vela/ci_verify_mtg_archive.sh"
      - "tests/test_vela_mtg_release_pin.py"
      - "internal/web/controller/miniapp.go"
      - "internal/web/session/session.go"
      - "internal/web/session/miniapp_sessions.go"
      - "internal/web/session/session_test.go"
      - "internal/web/service/tgminiapp/auth.go"
      - ".github/workflows/vela-miniapp-https-auth.yml"

permissions:
  contents: read

jobs:
  miniapp-https:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout verified source without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check historical privacy baseline and review test syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 vela-development/integration/baseline_privacy_gate.py
          python3 -m py_compile tests/ci_miniapp_https_auth.py
          # Session code changes also trigger this isolated HTTPS smoke.
          python3 -m unittest discover -s tests -p test_vela_dockerfile_isolation.py -v
          python3 -m unittest discover -s tests -p test_vela_mtg_release_pin.py -v
          python3 deploy/vela/ci_prepare_dockerfile.py Dockerfile "$RUNNER_TEMP/VelaMiniAppDockerfile"
          test -z "$(git status --porcelain)"
      - name: Build real panel only on disposable runner
        run: docker build --pull --no-cache -f "$RUNNER_TEMP/VelaMiniAppDockerfile" -t vela-miniapp-https-ci:local .
      - name: Prepare ephemeral signed HTTPS certificate and synthetic Bot Token
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          sudo chown 0:0 "$scratch"
          sudo chmod 700 "$scratch"
          echo "$scratch" > "$RUNNER_TEMP/vela-miniapp-path"
          sudo openssl req -x509 -newkey rsa:2048 -sha256 -noenc \
            -keyout "$scratch/vela-ci-key.pem" -out "$scratch/vela-ci-cert.pem" \
            -days 1 -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          sudo chmod 600 "$scratch/vela-ci-key.pem"
          sudo chmod 644 "$scratch/vela-ci-cert.pem"
          sudo python3 - "$scratch" <<'PY'
          from pathlib import Path
          import secrets, sys
          p = Path(sys.argv[1]) / 'vela_bot_token'
          p.write_text('123456:' + secrets.token_urlsafe(36))
          p.chmod(0o600)
          PY
          # Use upstream's existing local setting CLI. Suppress one-time admin
          # credentials and do not store this synthetic cert in source code.
          docker run --rm --network none --cap-drop ALL \
            --mount "type=bind,src=$scratch,dst=/etc/x-ui" \
            --entrypoint /app/x-ui vela-miniapp-https-ci:local \
            setting -webCert /etc/x-ui/vela-ci-cert.pem \
                    -webCertKey /etc/x-ui/vela-ci-key.pem >/dev/null 2>&1
      - name: Verify genuine HTTPS cookie, signature, CSRF and admin API
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(cat "$RUNNER_TEMP/vela-miniapp-path")"
          trap 'docker rm -f vela-miniapp-auth >/dev/null 2>&1 || true' EXIT
          docker run --detach --name vela-miniapp-auth --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$scratch,dst=/etc/x-ui" \
            --mount "type=bind,src=$scratch/vela_bot_token,dst=/run/secrets/vela_bot_token,readonly" \
            --tmpfs /tmp:rw,nosuid,size=16m \
            --tmpfs /var/log/x-ui:rw,nosuid,size=16m \
            -e XUI_ENABLE_FAIL2BAN=false -e XUI_DB_TYPE=sqlite \
            -e XUI_PORT=2053 \
            -e XUI_TG_MINIAPP_ENABLED=true \
            -e XUI_TG_MINIAPP_URL=https://localhost:2053/ \
            -e XUI_TG_MINIAPP_ADMIN_IDS=1001 \
            -e XUI_TG_MINIAPP_BOT_TOKEN_FILE=/run/secrets/vela_bot_token \
            vela-miniapp-https-ci:local >/dev/null
          docker exec -i vela-miniapp-auth python3 - < tests/ci_miniapp_https_auth.py
      - name: Audit every exported image layer and never publish fixtures
        shell: bash
        run: |
          set -euo pipefail
          docker image save vela-miniapp-https-ci:local | python3 deploy/vela/image_layer_audit.py --stdin
          echo "Synthetic HTTPS/Telegram checks completed; no customer credentials or image pushed."
      - name: Delete transient local credentials and certificates
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/vela-miniapp-path"; then
            scratch="$(cat "$RUNNER_TEMP/vela-miniapp-path")"
            docker rm -f vela-miniapp-auth >/dev/null 2>&1 || true
            sudo rm -rf -- "$scratch"
            rm -f "$RUNNER_TEMP/vela-miniapp-path"
          fi
