name: Vela ELF diagnostic unit tests (no secret material)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.repository == 'smgsp6/3x-ui' && github.event.repository.private == false && github.ref == 'refs/heads/vela-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile Python diagnostic code and fixture-only unit tests
        run: python3 -m py_compile deploy/vela/ci_elf_marker_inspect.py tests/test_vela_elf_marker_inspect.py
      - name: Validate ELF section, NOBITS and PEM header-only reporting
        run: python3 -m unittest discover -s tests -p test_vela_elf_marker_inspect.py -v
