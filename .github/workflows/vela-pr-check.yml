name: Vela integration and privacy gate

on:
  pull_request:
    paths:
      - 'internal/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'deploy/vela/**'
      - 'tests/**'
      - 'brand/**'
      - '.github/workflows/vela-pr-check.yml'
  workflow_dispatch:
  push:
    branches: [vela-dev]
    paths:
      - 'internal/**'
      - 'frontend/**'
      - 'deploy/vela/**'
      - 'tests/**'
      - 'vela-development/integration/**'
      - '.github/workflows/vela-pr-check.yml'

# This CI cannot deploy, upload production configuration, or write to GitHub.
permissions:
  contents: read

concurrency:
  group: vela-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Privacy audit before executing build scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Strict delta privacy check against immutable upstream baseline
        run: python3 vela-development/integration/baseline_privacy_gate.py
      - name: Reject tracked runtime secrets and private files (development gate)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import subprocess
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split(chr(0))
          invalid = []
          for name in filter(None, paths):
              parts = pathlib.PurePosixPath(name).parts
              base = parts[-1].lower()
              if base == ".env.example" or base.endswith(".env.example"):
                  continue
              if base == ".env" or base.startswith(".env.") or base.endswith((".key", ".p12", ".pfx", ".sqlite", ".sqlite3", ".db", ".db-wal", ".db-shm")):
                  invalid.append(name)
              if any(p.lower() in {"secrets", "backups", "failed-updates", "pgdata"} for p in parts[:-1]):
                  invalid.append(name)
          if invalid:
              raise SystemExit(f"BLOCK: {len(invalid)} prohibited tracked runtime files")
          print("No prohibited runtime-data paths tracked")
          PY

  integration:
    name: React build, full Go tests and executable
    needs: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked React dependencies
        working-directory: frontend
        run: npm ci
      - name: Full TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Install locked Playwright Chromium for browser-backed tests
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: React unit and browser tests
        working-directory: frontend
        run: npm test
      # Vela's Go server uses //go:embed all:dist. The upstream repository
      # does not track internal/web/dist. Building Go before Vite fails on a
      # clean checkout even if the Go sources are otherwise valid.
      - name: Build React panel AND Telegram Mini App first
        working-directory: frontend
        run: npm run build
      - name: Ensure both app entry points were generated
        shell: bash
        run: |
          test -s internal/web/dist/index.html
          test -s internal/web/dist/miniapp.html
          test -s internal/web/dist/login.html
      - name: Full Go tests (with embedded React assets present)
        run: go test ./...
      - name: Mini App crypto and TLS race tests
        run: go test -race ./internal/web/service/tgminiapp
      - name: Build full Go panel executable
        run: go build -trimpath -o "${RUNNER_TEMP}/vela-ci" ./main.go
      - name: Runtime dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Go dependency vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  maintenance:
    name: Backup, recovery and patch contract tests
    needs: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify root patch script against SHA-verified phase-12 archive
        shell: bash
        run: |
          set -euo pipefail
          echo "385cddc8631461e2bce5d67317dae405679c9a5d8a75f20e6a84fedeedbb4a37  apply_to_repo.py" | sha256sum -c -
      - name: Unit tests including Docker simulation and build order
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Shell syntax
        run: |
          bash -n deploy/vela/vela
          bash -n deploy/vela/preflight.sh
          bash -n deploy/vela/security-check.sh

  docker:
    name: Clean Docker image build (no push)
    needs: [privacy, integration, maintenance]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Build only from a clean checkout; no .env, db or Secret is available.
      # No registry login, image push, deploy or production credentials.
      - name: Recheck build-context privacy against audited baseline
        run: python3 vela-development/integration/baseline_privacy_gate.py .
      - name: Build final image from reviewed Dockerfile
        run: docker build --pull --no-cache --tag vela-integration-ci:local .
      - name: Inspect resulting image metadata
        run: |
          docker image inspect vela-integration-ci:local --format '{{.Id}}'
          test "$(docker image inspect vela-integration-ci:local --format '{{.Architecture}}')" = amd64
      - name: Audit every final-image layer for private data (never upload tar)
        run: docker image save vela-integration-ci:local | python3 deploy/vela/image_layer_audit.py --stdin
